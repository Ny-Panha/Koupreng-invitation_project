  /api/v1/public/invitations/{slug}/rsvp:
    post:
      tags:
      - RSVP
      summary: Submit a public RSVP
      description: Create or update a public RSVP after invitation access and deadline
        validation.
      operationId: publicRsvp
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        example: demo-wedding
      - name: accessToken
        in: query
        required: false
        schema:
          type: string
        example: demo-invitation-access-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpRequest"
            examples:
              attending:
                summary: Attending with a guest
                value:
                  guestName: Dara Sok
                  phone: "012345679"
                  email: dara.sok@example.com
                  responseStatus: ATTENDING
                  attendeeCount: 2
                  message: We are delighted to celebrate with you.
              notAttending:
                summary: Unable to attend
                value:
                  guestName: Sophea Lim
                  phone: "012345682"
                  email: sophea.lim@example.com
                  responseStatus: NOT_ATTENDING
                  attendeeCount: 0
                  message: Thank you for the invitation; we send our best wishes.
        required: true
      responses:
        "201":
          description: RSVP accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRsvpResponse"
        "400":
          description: Invalid RSVP or closed deadline
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Public RSVP rate limit exceeded
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
