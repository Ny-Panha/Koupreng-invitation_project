openapi: 3.1.0
info:
  title: Koupreng E-Invitation API
  description: |
    REST API for the Koupreng E-Invitation platform, including authentication,
    users, invitations, templates, guests, RSVP, check-in, media, payments,
    organizations, subscriptions, notifications, reporting, administration,
    and related services. The current contract includes both legacy /api routes
    and versioned /api/v1 routes; the version below does not imply a global base path.
  version: v1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Wedding Gifts
  description: Invitation-owner wedding gift records and contribution amounts.
- name: Subscriptions
  description: "Authenticated package catalog, subscription history, and purchase\
    \ creation."
- name: Payments
  description: Administrative payment verification and fulfillment.
- name: Seating
  description: "Invitation-owner tables, seat assignments, summaries, and exports."
- name: Administration
  description: "ADMIN-only notification creation, delivery status, and audit operations."
- name: Invitations
  description: Invitation-owner lifecycle and public published-invitation access.
- name: RSVP
  description: Rate-limited public RSVP submission and invitation-owner RSVP management.
- name: Notifications
  description: Current-user and invitation-owner notification views and read state.
- name: QR Codes
  description: Invitation-owner invitation and personalized guest QR payload generation.
- name: Media
  description: Validated invitation-owner uploads and public published-invitation
    media reads.
- name: Organizations
  description: Authenticated organization membership and owner-managed member access.
- name: Health
  description: Public application liveness endpoint.
- name: Payment History
  description: Current-user payment orders and receipts with ownership enforcement.
- name: Audit Logs
  description: Activity tracking for admin changes and deletions.
- name: Check-In
  description: Invitation-owner guest check-in by QR token or manual selection.
- name: Reports
  description: "Authenticated dashboards, invitation-owner reports, and CSV exports."
- name: Guests
  description: "Invitation-owner guest records, grouping, import, search, send lists,\
    \ and exports."
- name: Authentication
  description: "Registration, login, social identity, token invalidation, and account\
    \ recovery."
- name: Internationalization
  description: Public localized message bundles used by the clients.
- name: AI Invitation Assistant
  description: "Authenticated invitation copy, story, translation, and timeline suggestions."
- name: Administration
  description: "ADMIN-only user, template, invitation, reporting, package, payment,\
    \ and audit operations."
- name: Invitation Delivery
  description: "Invitation-owner preparation, sharing, email, reminders, and delivery\
    \ history."
- name: Payments
  description: "Authenticated template payments, public PayWay redirects/callback,\
    \ and ADMIN-only confirmation."
- name: Budget
  description: "Invitation-owner budget planning, line items, summaries, and exports."
- name: Users
  description: "Current-user profile, password, and validated profile-image operations."
- name: Templates
  description: Public active invitation template catalog.
- name: Events
  description: ADMIN-only lifecycle operations for the legacy event model.
