<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Garden final review</title>
<style>body{margin:0;padding:24px;background:#071b34;color:#fff6df;font:16px/1.6 system-ui}h1{font-size:24px;color:#f2d693}label{display:inline-block;margin:0 16px 16px 0}select{display:block;padding:10px;background:#fff6df;color:#071b34;border-radius:4px}main{display:flex;gap:20px;align-items:start;flex-wrap:wrap}figure{margin:0}img{display:block;max-width:100%;height:auto;border:1px solid #bc995b}figcaption{margin:8px 0;color:#f2d693}a{color:#f2d693}p{max-width:900px}.comparison{width:800px;max-width:100%}</style>
<h1>Royal Garden · final visual review</h1><p>Original blue/gold art and editable data. The film is paused at 0.5s; motion and audio are verified separately. LEFT reference colors and people differ.</p>
<label>Scene<select id="scene"><option value="cover">Cover</option><option value="video">Pre-wedding film</option><option value="information">Information top</option><option value="information-scrolled">Information scrolled</option><option value="ending">Reachable ending</option></select></label>
<label>Language<select id="locale"><option value="km">Khmer</option><option value="en">English</option></select></label><label>Viewport<select id="size"><option>390x844</option><option>512x900</option></select></label>
<main><figure><figcaption id="caption"></figcaption><a id="full"><img id="capture" width="390" alt="Final Royal Garden browser capture"></a></figure><figure class="comparison"><figcaption>Supplied LEFT / before reconstruction / final</figcaption><a id="compareLink"><img id="comparison" alt="Reference, rejected composition and final implementation"></a></figure></main>
<p><a href="visual-review.md">Three review passes and differences</a> · <a href="qa-results.md">Verification and limits</a> · <a href="evidence/chromium-studio.png">Invitation Studio</a> · <a href="evidence/soundtrack-and-gate-proof.json">Audio and gate proof</a></p>
<script>const scene=document.querySelector('#scene'),locale=document.querySelector('#locale'),size=document.querySelector('#size');function update(){const name=`evidence/final-${size.value}-${locale.value}-${scene.value}.png`;document.querySelector('#capture').src=name;document.querySelector('#full').href=name;document.querySelector('#caption').textContent=`${scene.selectedOptions[0].text} · ${locale.selectedOptions[0].text} · ${size.value}`;const comparison=`evidence/comparison-${scene.value.startsWith('information')||scene.value==='ending'?'information':scene.value}.jpg`;document.querySelector('#comparison').src=comparison;document.querySelector('#compareLink').href=comparison;}[scene,locale,size].forEach(select=>select.addEventListener('change',update));update();</script></html>
