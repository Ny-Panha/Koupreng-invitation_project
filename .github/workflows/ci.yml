name: CI Pipeline

on:
  push:
    branches:
      - main
      - chore/repository-cleanup-and-qa
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Scan tracked source with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/${archive}" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" dir . --redact --no-banner \
            --report-format json --report-path "${RUNNER_TEMP}/gitleaks-redacted.json"

      - name: Upload redacted secret scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-redacted
          path: ${{ runner.temp }}/gitleaks-redacted.json
          if-no-files-found: error

  backend:
    name: Backend Build, Test, Coverage & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verify backend
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Analyze declared dependencies
        working-directory: apps/backend
        run: ./mvnw --batch-mode dependency:analyze

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-jacoco-report
          path: apps/backend/target/site/jacoco/
          if-no-files-found: error

  backend-static:
    name: Backend Static & Dependency Usage Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Run SpotBugs, PMD, and dependency analysis
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -DskipTests compile spotbugs:check pmd:check dependency:analyze

  frontend-user:
    name: User Frontend Lint, Test, Analysis & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend-user/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend-user
        run: npm ci

      - name: Lint, test, and analyze
        working-directory: apps/frontend-user
        run: |
          npm run lint
          npm test
          npm run analyze:knip
          npm run analyze:deps

      - name: Build production bundle
        working-directory: apps/frontend-user
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-user-dist
          path: apps/frontend-user/dist/
          if-no-files-found: error

  frontend-admin:
    name: Admin Frontend Lint, Test, Analysis & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend-admin/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend-admin
        run: npm ci

      - name: Lint, test, and analyze
        working-directory: apps/frontend-admin
        run: |
          npm run lint
          npm test
          npm run analyze:knip
          npm run analyze:deps

      - name: Build production bundle
        working-directory: apps/frontend-admin
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-admin-dist
          path: apps/frontend-admin/dist/
          if-no-files-found: error

  telegram-bot:
    name: Telegram Bot Lint, Test & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/telegram-bot/requirements.txt
            apps/telegram-bot/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/telegram-bot
        run: python -m pip install -r requirements-dev.txt

      - name: Lint, test, audit source, and compile
        working-directory: apps/telegram-bot
        run: |
          python -m ruff check .
          python -m pytest -q
          python -m bandit -q -r main.py start.py
          python -m compileall -q main.py start.py tests

  flyway-migration:
    name: Fresh MySQL Flyway Migration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: koupreng_flyway_ci
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RUN_FLYWAY_INTEGRATION: 'true'
      FLYWAY_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/koupreng_flyway_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      FLYWAY_TEST_DB_USERNAME: root
      FLYWAY_TEST_DB_PASSWORD: ci_only_root_password
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Apply every migration and validate the schema
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode '-Dtest=*MySqlTests,FreshDatabaseMigrationTests' test

      - name: Upload MySQL test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysql-integrity-reports
          path: apps/backend/target/surefire-reports/
          if-no-files-found: error

  backend-http-mysql:
    name: Real HTTP MySQL Ownership, RBAC & Entitlements
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: phase7_disposable
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports:
          - 3416:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RUN_PHASE7_MYSQL: 'true'
      FLYWAY_TEST_DB_URL: jdbc:mysql://127.0.0.1:3416/phase7_disposable?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      FLYWAY_TEST_DB_USERNAME: root
      FLYWAY_TEST_DB_PASSWORD: ci_only_root_password
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Exercise real HTTP security and owner entitlement contracts
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -Dtest=Phase7CollaborationMySqlTests,Phase9MediaMySqlTests test

      - name: Upload HTTP integration reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: http-mysql-security-reports
          path: |
            apps/backend/target/surefire-reports/
            apps/backend/target/package-policy.json
          if-no-files-found: error

  browser-tests:
    name: Browser E2E & Route Smoke
    runs-on: ubuntu-latest
    needs:
      - frontend-user
      - frontend-admin
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/frontend-user/package-lock.json
            apps/frontend-admin/package-lock.json

      - name: Install and build frontends
        run: |
          npm --prefix apps/frontend-user ci
          npm --prefix apps/frontend-admin ci
          npm --prefix apps/frontend-user run build
          npm --prefix apps/frontend-admin run build

      - name: Install Playwright Chromium
        working-directory: apps/frontend-user
        run: npx playwright install --with-deps chromium

      - name: Run controlled browser journeys
        working-directory: apps/frontend-user
        run: npx playwright test tests/e2e/critical-routes.spec.js

      - name: Run all-route browser smoke
        working-directory: apps/frontend-user
        run: npx playwright test tests/e2e/route-smoke.spec.js

      - name: Verify Studio, template locales, guests and tickets
        working-directory: apps/frontend-user
        run: npx playwright test tests/e2e/guest-workspace.spec.js tests/e2e/studio-tickets.spec.js tests/e2e/next-studio-ux.spec.js tests/e2e/phase12-matrix.spec.js

      - name: Verify mobile package purchase and activation contracts
        working-directory: apps/frontend-user
        # Desktop pixel comparisons use reviewed Windows baselines locally.
        run: npx playwright test tests/e2e/package-purchase-ux.spec.js --project=mobile-chromium

      - name: Install isolated accessibility QA tool
        run: npm install --prefix "$RUNNER_TEMP/report-a11y" --no-save --ignore-scripts --no-audit axe-core@4.14.0

      - name: Set up Java 25 for current reporting fixtures
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Generate reporting fixtures from current backend code
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -Dtest=AdminReportingTests test

      - name: Set up Python for independent document validation
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install isolated PDF validation tool
        run: python -m pip install --target "$RUNNER_TEMP/report-pdf" 'PyMuPDF==1.28.2'

      - name: Verify reporting workspace, exports, and PDF journeys
        env:
          ADMIN_REPORT_AXE_PATH: ${{ runner.temp }}/report-a11y/node_modules/axe-core/axe.min.js
          ADMIN_REPORT_PDF_TOOLS: ${{ runner.temp }}/report-pdf
        shell: bash
        run: |
          set -euo pipefail
          node apps/frontend-admin/node_modules/vite/bin/vite.js preview apps/frontend-admin --host 127.0.0.1 --port 4184 --strictPort > "$RUNNER_TEMP/report-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4184/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa/admin-reporting-browser.mjs
          node scripts/qa/admin-reports-workspace.mjs
          python scripts/qa/inspect-admin-reporting-pdfs.py

      - name: Upload reporting workspace evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-reports-workspace-evidence
          path: |
            output/playwright/admin-reports-workspace/after/
            output/admin-reporting/browser-evidence.json
            output/admin-reporting/pdf-inspection.json
            output/admin-reporting/download-inspection.json
            output/admin-reporting/*.pdf
            output/admin-reporting/failure*
          if-no-files-found: ignore

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: |
            apps/frontend-user/playwright-report/
            apps/frontend-user/test-results/
          if-no-files-found: ignore

  vulnerability-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/frontend-user/package-lock.json
            apps/frontend-admin/package-lock.json

      - name: Audit Node lockfiles
        run: |
          npm --prefix apps/frontend-user audit --audit-level=high
          npm --prefix apps/frontend-admin audit --audit-level=high

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/telegram-bot/requirements.txt
            apps/telegram-bot/requirements-dev.txt

      - name: Audit Python lock-equivalent requirements
        working-directory: apps/telegram-bot
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip_audit -r requirements.txt

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Select a current official NVD source
        id: nvd-source
        run: node scripts/ci/check-nvd-feed.mjs --select-source

      - name: Audit Java dependencies
        working-directory: apps/backend
        env:
          NVD_SOURCE: ${{ steps.nvd-source.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          audit_args=()
          case "$NVD_SOURCE" in
            feed) ;;
            api)
              # Bootstrap all historical records efficiently, even when feeds are
              # stale. This is not an audit; the following verify must refresh
              # from the live API with nvdValidForHours=0 before scanning.
              ./mvnw --batch-mode --update-snapshots -Pdependency-security -DskipTests dependency-check:update-only
              audit_args+=("-DnvdDatafeedUrl=")
              ;;
            *) echo "Invalid NVD audit source" >&2; exit 1 ;;
          esac
          # Recheck missing artifacts instead of retaining failures from the restored Maven cache.
          ./mvnw --batch-mode --update-snapshots -Pdependency-security -DskipTests "${audit_args[@]}" verify

      - name: Upload Java dependency audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-dependency-audit
          path: apps/backend/target/dependency-check-report.*
          if-no-files-found: warn

  deployment-config:
    name: Deployment Configuration & Docker Applicability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up Node.js 22 for repository and configuration regressions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Verify repository policy and local configuration
        run: node --test scripts/qa/*.test.mjs

      - name: Validate YAML configuration
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              Path('.github/workflows/ci.yml'),
              Path('docker-compose.yml'),
              Path('infra/monitoring/prometheus.yml'),
              Path('apps/backend/src/test/resources/contracts/openapi.yaml'),
          ]
          for path in paths:
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'validated {path}')
          PY

      - name: Validate executable scripts and required deployment assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do bash -n "$script"; done < <(git ls-files '*.sh')
          node --check scripts/ci/browser-smoke.mjs
          test -f .env.example
          test -f docker-compose.yml
          test -f infra/nginx/koupreng-api.conf
          test -f infra/nginx/docker/gateway.conf.template
          test -f infra/monitoring/prometheus.yml
          test -f infra/backup/mysql-backup.ps1

      - name: Validate Compose interpolation and service topology
        env:
          DB_PASSWORD: ci_compose_database_password
          MYSQL_ROOT_PASSWORD: ci_compose_root_password
          JWT_SECRET: ci_compose_jwt_secret_with_more_than_sixty_four_characters_123456789
          ADMIN_PAYMENT_SECRET: ci_compose_payment_secret
          TELEGRAM_BOT_TOKEN: 000000000:ci-placeholder-token
          TELEGRAM_WEBHOOK_SECRET: ci_compose_webhook_secret
          ABA_PAYWAY_STATIC_LINK: https://example.invalid/khqr
        run: docker compose config --quiet

      - name: Build tracked Dockerfiles when applicable
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dockerfiles < <(git ls-files | grep -E '(^|/)(Dockerfile|Dockerfile\.[^/]+)$' || true)
          if (( ${#dockerfiles[@]} == 0 )); then
            echo 'No tracked Dockerfiles; Docker build validation is not applicable.'
            exit 0
          fi
          for dockerfile in "${dockerfiles[@]}"; do
            docker build --file "$dockerfile" "$(dirname "$dockerfile")"
          done
