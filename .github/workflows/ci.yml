name: CI Pipeline

on:
  push:
    branches:
      - main
      - chore/repository-cleanup-and-qa
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan tracked source with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/${archive}" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" dir . --redact --no-banner

  backend:
    name: Backend Build, Test, Coverage & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verify backend
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Analyze declared dependencies
        working-directory: apps/backend
        run: ./mvnw --batch-mode dependency:analyze

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: apps/backend/target/site/jacoco/
          if-no-files-found: error

  backend-static:
    name: Backend Static & Dependency Usage Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Run SpotBugs, PMD, and dependency analysis
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -DskipTests compile spotbugs:check pmd:check dependency:analyze

  frontend-user:
    name: User Frontend Lint, Test, Analysis & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend-user/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend-user
        run: npm ci

      - name: Lint, test, and analyze
        working-directory: apps/frontend-user
        run: |
          npm run lint
          npm test
          npm run analyze:knip
          npm run analyze:deps

      - name: Build production bundle
        working-directory: apps/frontend-user
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-user-dist
          path: apps/frontend-user/dist/
          if-no-files-found: error

  frontend-admin:
    name: Admin Frontend Lint, Test, Analysis & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend-admin/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend-admin
        run: npm ci

      - name: Lint, test, and analyze
        working-directory: apps/frontend-admin
        run: |
          npm run lint
          npm test
          npm run analyze:knip
          npm run analyze:deps

      - name: Build production bundle
        working-directory: apps/frontend-admin
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-admin-dist
          path: apps/frontend-admin/dist/
          if-no-files-found: error

  telegram-bot:
    name: Telegram Bot Lint, Test & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/telegram-bot/requirements.txt
            apps/telegram-bot/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/telegram-bot
        run: python -m pip install -r requirements-dev.txt

      - name: Lint, test, audit source, and compile
        working-directory: apps/telegram-bot
        run: |
          python -m ruff check .
          python -m pytest -q
          python -m bandit -q -r main.py start.py
          python -m compileall -q main.py start.py tests

  flyway-migration:
    name: Fresh MySQL Flyway Migration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: koupreng_flyway_ci
          MYSQL_ROOT_PASSWORD: ci_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RUN_FLYWAY_INTEGRATION: 'true'
      FLYWAY_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/koupreng_flyway_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      FLYWAY_TEST_DB_USERNAME: root
      FLYWAY_TEST_DB_PASSWORD: ci_only_root_password
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Apply every migration and validate the schema
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -Dtest=FreshDatabaseMigrationTests test

  browser-tests:
    name: Browser E2E & Route Smoke
    runs-on: ubuntu-latest
    needs:
      - frontend-user
      - frontend-admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/frontend-user/package-lock.json
            apps/frontend-admin/package-lock.json

      - name: Install and build frontends
        run: |
          npm --prefix apps/frontend-user ci
          npm --prefix apps/frontend-admin ci
          npm --prefix apps/frontend-user run build
          npm --prefix apps/frontend-admin run build

      - name: Install Playwright Chromium
        working-directory: apps/frontend-user
        run: npx playwright install --with-deps chromium

      - name: Run controlled browser journeys
        working-directory: apps/frontend-user
        run: npx playwright test tests/e2e/critical-routes.spec.js

      - name: Run all-route browser smoke
        working-directory: apps/frontend-user
        run: npx playwright test tests/e2e/route-smoke.spec.js

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            apps/frontend-user/playwright-report/
            apps/frontend-user/test-results/
          if-no-files-found: ignore

  vulnerability-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/frontend-user/package-lock.json
            apps/frontend-admin/package-lock.json

      - name: Audit Node lockfiles
        run: |
          npm --prefix apps/frontend-user audit --audit-level=high
          npm --prefix apps/frontend-admin audit --audit-level=high

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/telegram-bot/requirements.txt
            apps/telegram-bot/requirements-dev.txt

      - name: Audit Python lock-equivalent requirements
        working-directory: apps/telegram-bot
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip_audit -r requirements.txt

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Audit Java dependencies
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -Pdependency-security -DskipTests verify

  deployment-config:
    name: Deployment Configuration & Docker Applicability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate YAML configuration
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [
              Path('.github/workflows/ci.yml'),
              Path('docker-compose.yml'),
              Path('infra/monitoring/prometheus.yml'),
              Path('packages/api-contracts/openapi.yaml'),
          ]
          for path in paths:
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'validated {path}')
          PY

      - name: Validate executable scripts and required deployment assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do bash -n "$script"; done < <(git ls-files '*.sh')
          node --check scripts/ci/browser-smoke.mjs
          test -f .env.example
          test -f docker-compose.yml
          test -f infra/nginx/koupreng-api.conf
          test -f infra/nginx/docker/gateway.conf.template
          test -f infra/monitoring/prometheus.yml
          test -f infra/backup/mysql-backup.ps1

      - name: Validate Compose interpolation and service topology
        env:
          DB_PASSWORD: ci_compose_database_password
          MYSQL_ROOT_PASSWORD: ci_compose_root_password
          JWT_SECRET: ci_compose_jwt_secret_with_more_than_sixty_four_characters_123456789
          ADMIN_PAYMENT_SECRET: ci_compose_payment_secret
          TELEGRAM_BOT_TOKEN: 000000000:ci-placeholder-token
          TELEGRAM_WEBHOOK_SECRET: ci_compose_webhook_secret
          ABA_PAYWAY_STATIC_LINK: https://example.invalid/khqr
        run: docker compose config --quiet

      - name: Build tracked Dockerfiles when applicable
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dockerfiles < <(git ls-files | grep -E '(^|/)(Dockerfile|Dockerfile\.[^/]+)$' || true)
          if (( ${#dockerfiles[@]} == 0 )); then
            echo 'No tracked Dockerfiles; Docker build validation is not applicable.'
            exit 0
          fi
          for dockerfile in "${dockerfiles[@]}"; do
            docker build --file "$dockerfile" "$(dirname "$dockerfile")"
          done
