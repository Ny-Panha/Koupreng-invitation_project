<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/branding/icons/icon-16.png" />
    <link rel="shortcut icon" href="/branding/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Koupreng - សំបុត្រអញ្ជើញឌីជីថល (Digital Invitation)</title>
    <script src="/color-mode.js"></script>

    <!-- Public marketing uses locally licensed fonts; legacy catalogs load per route. -->
    <script>
      if (["/", "/pricing", "/contact", "/templates"].includes(location.pathname)) {
        let marketingLanguage = "km";
        try { marketingLanguage = localStorage.getItem("koupreng.lang") || "km"; } catch (_) {}
        const fontHint = document.createElement("link");
        fontHint.rel = "preload"; fontHint.as = "font"; fontHint.type = "font/woff2"; fontHint.crossOrigin = "anonymous";
        fontHint.href = marketingLanguage === "en" ? "/fonts/marketing/DMSans-Latin.woff2" : "/fonts/silk-heritage/KantumruyPro.woff2";
        document.head.appendChild(fontHint);
        if (location.pathname === "/") {
          const portraitHint = document.createElement("link");
          portraitHint.rel = "preload"; portraitHint.as = "image"; portraitHint.href = "/templates/khmer-floral-gold/phone-preview-440.webp"; portraitHint.fetchPriority = "high";
          portraitHint.imageSrcset = "/templates/khmer-floral-gold/phone-preview-440.webp 440w, /templates/khmer-floral-gold/phone-preview-880.webp 880w";
          portraitHint.imageSizes = "(max-width: 767px) 300px, 360px";
          document.head.appendChild(portraitHint);
        }
      }
    </script>

    <!-- Telegram WebApp SDK -->
    <script>
      // Only this known catalog cover is safe to discover before owner/API data.
      // Hosted invitations keep their authorized, owner-selected media pipeline.
      if (location.pathname === "/templates/royal-garden-cinematic") {
        const royalPortrait = document.createElement("link");
        royalPortrait.rel = "preload"; royalPortrait.as = "image"; royalPortrait.fetchPriority = "high";
        royalPortrait.href = "/templates/royal-garden/v3-1/demo-portrait-480.webp";
        royalPortrait.imageSrcset = "/templates/royal-garden/v3-1/demo-portrait-480.webp 480w, /templates/royal-garden/v3/opening/demo-portrait-640.webp 640w, /templates/silk-heritage/portrait.webp 960w";
        royalPortrait.imageSizes = "(max-width: 639px) 100vw, (max-width: 1023px) min(88vw, 62vh), min(600px, 58vh)";
        document.head.appendChild(royalPortrait);
        const royalFrame = document.createElement("link");
        royalFrame.rel = "preload"; royalFrame.as = "image";
        royalFrame.href = "/templates/royal-garden/v3-1/opening-frame-480.webp";
        royalFrame.imageSrcset = "/templates/royal-garden/v3-1/opening-frame-480.webp 480w, /templates/royal-garden/v3-1/opening-frame-640.webp 640w, /templates/royal-garden/v3-1/opening-frame-1200.webp 1200w";
        royalFrame.imageSizes = royalPortrait.imageSizes;
        document.head.appendChild(royalFrame);
        // The visible calligraphy is the measured cover LCP. Match its exact
        // responsive source so discovery does not wait for the template chunk.
        const royalLettering = document.createElement("link");
        royalLettering.rel = "preload"; royalLettering.as = "image"; royalLettering.fetchPriority = "high";
        royalLettering.href = "/templates/royal-garden/v3-1/opening-calligraphy-320.webp";
        royalLettering.imageSrcset = "/templates/royal-garden/v3-1/opening-calligraphy-320.webp 320w, /templates/royal-garden/v3/opening/calligraphy-640.webp 640w, /templates/royal-garden/v3-1/opening-calligraphy-800.webp 800w, /templates/royal-garden/v3/opening/calligraphy.webp 1100w";
        royalLettering.imageSizes = "(max-width: 639px) 71vw, 420px";
        document.head.appendChild(royalLettering);
      }
    </script>
    <script async src="https://telegram.org/js/telegram-web-app.js" onload="window.dispatchEvent(new Event('telegram-web-app-ready'))"></script>

    <!-- Open Graph / Telegram / Facebook / Messenger -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Koupreng - សំបុត្រអញ្ជើញឌីជីថល" />
    <meta property="og:title" content="លិខិតអញ្ជើញអាពាហ៍ពិពាហ៍ | Koupreng Invitation" />
    <meta property="og:description" content="សូមគោរពអញ្ជើញចូលរួមជាអធិបតី និងជាភ្ញៀវកិត្តិយសក្នុងពិធីមង្គលការ។ សូមចុចតំណភ្ជាប់ដើម្បីមើលសំបុត្រអញ្ជើញ និង RSVP។" />
    <meta property="og:image" content="%VITE_PUBLIC_APP_URL%/branding/social-card.jpg" />
    <meta property="og:image:secure_url" content="%VITE_PUBLIC_APP_URL%/branding/social-card.jpg" />
    <meta property="og:image:alt" content="គូព្រេង · Koupreng" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / Telegram Preview Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="លិខិតអញ្ជើញអាពាហ៍ពិពាហ៍ | Koupreng Invitation" />
    <meta name="twitter:description" content="សូមគោរពអញ្ជើញចូលរួមជាអធិបតី និងជាភ្ញៀវកិត្តិយសក្នុងពិធីមង្គលការ។ សូមចុចតំណភ្ជាប់ដើម្បីមើលសំបុត្រអញ្ជើញ និង RSVP។" />
    <meta name="twitter:image" content="%VITE_PUBLIC_APP_URL%/branding/social-card.jpg" />
    <meta name="twitter:image:alt" content="គូព្រេង · Koupreng" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
