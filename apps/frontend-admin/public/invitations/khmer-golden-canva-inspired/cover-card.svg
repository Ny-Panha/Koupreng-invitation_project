<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Khmer golden elegant wedding invitation cover</title>
  <desc id="desc">Original ivory and gold invitation card with Khmer wedding typography and ornamental border.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.48" stop-color="#f7ead5"/>
      <stop offset="1" stop-color="#fff8ec"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4df9f"/>
      <stop offset="0.45" stop-color="#c99a3d"/>
      <stop offset="1" stop-color="#8c6424"/>
    </linearGradient>
    <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M8 13h1M24 7h1M35 27h1M15 34h1M30 18h1" stroke="#b88a2e" stroke-opacity=".18" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#4b2f1a" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="#ead6b6"/>
  <rect x="42" y="42" width="816" height="1116" rx="34" fill="url(#paper)" filter="url(#softShadow)"/>
  <rect x="42" y="42" width="816" height="1116" rx="34" fill="url(#grain)" opacity=".5"/>

  <rect x="88" y="88" width="724" height="1024" rx="24" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <rect x="112" y="112" width="676" height="976" rx="18" fill="none" stroke="#b88a2e" stroke-opacity=".36" stroke-width="1.5"/>

  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 170c42-44 93-44 122 0M150 170c29 8 48 27 57 57M272 170c-29 8-48 27-57 57" stroke-width="5"/>
    <path d="M150 1030c42 44 93 44 122 0M150 1030c29-8 48-27 57-57M272 1030c-29-8-48-27-57-57" stroke-width="5"/>
    <path d="M628 170c42-44 93-44 122 0M628 170c29 8 48 27 57 57M750 170c-29 8-48 27-57 57" stroke-width="5"/>
    <path d="M628 1030c42 44 93 44 122 0M628 1030c29-8 48-27 57-57M750 1030c-29-8-48-27-57-57" stroke-width="5"/>
  </g>

  <g opacity=".22" fill="#c99a3d">
    <circle cx="450" cy="218" r="86"/>
    <circle cx="450" cy="218" r="58" fill="#fffdf7"/>
    <path d="M450 118l18 62 62-18-44 48 44 48-62-18-18 62-18-62-62 18 44-48-44-48 62 18z"/>
  </g>

  <text x="450" y="204" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="34" fill="#8c6424" letter-spacing="0">THE WEDDING</text>
  <text x="450" y="250" text-anchor="middle" font-family="Noto Serif Khmer, Hanuman, Battambang, serif" font-size="38" fill="#3a2514">សិរីមង្គលអាពាហ៍ពិពាហ៍</text>

  <path d="M252 330h396" stroke="url(#gold)" stroke-width="2"/>
  <path d="M405 330c20-26 70-26 90 0" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>

  <text x="450" y="462" text-anchor="middle" font-family="Noto Serif Khmer, Hanuman, Battambang, serif" font-size="76" fill="#3a2514">វណ្ណដា</text>
  <text x="450" y="552" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="52" fill="#b88a2e">✦</text>
  <text x="450" y="640" text-anchor="middle" font-family="Noto Serif Khmer, Hanuman, Battambang, serif" font-size="76" fill="#3a2514">ស្រីពេជ្រ</text>

  <path d="M315 708h270" stroke="url(#gold)" stroke-width="2"/>
  <text x="450" y="780" text-anchor="middle" font-family="Noto Sans Khmer, Battambang, sans-serif" font-size="31" fill="#5c4328">ថ្ងៃពុធ ទី២៨ ខែមករា ឆ្នាំ២០២៦</text>
  <text x="450" y="836" text-anchor="middle" font-family="Noto Sans Khmer, Battambang, sans-serif" font-size="29" fill="#5c4328">០៧:០០ ព្រឹក និង ១៧:០០ ល្ងាច</text>
  <text x="450" y="902" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="34" fill="#8c6424">The Premier Center Sen Sok</text>

  <g fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity=".78">
    <path d="M310 978c38-28 74-28 108 0 24 20 43 20 64 0 34-28 70-28 108 0"/>
    <path d="M354 1008c30 17 62 17 96 0 34 17 66 17 96 0"/>
  </g>
</svg>
