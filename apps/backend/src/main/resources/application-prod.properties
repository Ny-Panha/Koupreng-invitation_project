spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# API documentation is opt-in in production.
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
scalar.enabled=${SCALAR_ENABLED:false}
scalar.persist-auth=false
app.dev-sample-data.enabled=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.info.env.enabled=${MANAGEMENT_INFO_ENV_ENABLED:true}
management.defaults.metrics.export.enabled=${MANAGEMENT_METRICS_EXPORT_ENABLED:true}
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
info.app.name=${spring.application.name}
info.app.description=Koupreng invitation backend

server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:60MB}

app.jwt.issuer=${JWT_ISSUER:koupreng-backend}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:60}
app.invitation.max-public-rsvp-submissions-per-minute=${PUBLIC_RSVP_MAX_SUBMISSIONS_PER_MINUTE:5}
app.auth.first-user-admin-enabled=${FIRST_USER_ADMIN_ENABLED:false}
app.auth.max-login-attempts-per-minute=${AUTH_MAX_LOGIN_ATTEMPTS_PER_MINUTE:10}
app.auth.max-register-attempts-per-minute=${AUTH_MAX_REGISTER_ATTEMPTS_PER_MINUTE:5}
app.auth.max-social-login-attempts-per-minute=${AUTH_MAX_SOCIAL_LOGIN_ATTEMPTS_PER_MINUTE:20}
app.auth.max-forgot-password-attempts-per-minute=${AUTH_MAX_FORGOT_PASSWORD_ATTEMPTS_PER_MINUTE:3}
app.auth.max-reset-password-attempts-per-minute=${AUTH_MAX_RESET_PASSWORD_ATTEMPTS_PER_MINUTE:5}
app.oauth.google.client-ids=${GOOGLE_CLIENT_IDS:${VITE_GOOGLE_CLIENT_ID:}}
app.oauth.google.jwk-set-uri=${GOOGLE_JWK_SET_URI:https://oauth2.googleapis.com/tokeninfo}
app.oauth.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.oauth.telegram.auth-max-age-seconds=${TELEGRAM_AUTH_MAX_AGE_SECONDS:600}
app.oauth.telegram.email-domain=${TELEGRAM_EMAIL_DOMAIN:telegram.local}
app.oauth.telegram.client-id=${TELEGRAM_CLIENT_ID:}
app.oauth.telegram.jwk-set-uri=${TELEGRAM_JWK_SET_URI:https://oauth.telegram.org/.well-known/jwks.json}

app.security.cors.enabled=${CORS_ENABLED:true}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
app.security.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,X-Request-Id}
app.security.cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Request-Id}
app.security.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:1800}
app.security.https.required=${HTTPS_REQUIRED:true}
app.security.https.hsts-enabled=${HSTS_ENABLED:true}
app.security.https.hsts-max-age-seconds=${HSTS_MAX_AGE_SECONDS:31536000}
app.security.logging.enabled=${API_LOGGING_ENABLED:true}
app.security.logging.include-query-string=${API_LOGGING_INCLUDE_QUERY_STRING:false}
app.security.logging.include-health-checks=${API_LOGGING_INCLUDE_HEALTH_CHECKS:false}

# Body serialization at DEBUG/TRACE can expose credentials and personal data.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=OFF
app.security.upload.enabled=${UPLOAD_VALIDATION_ENABLED:true}
app.security.upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES:52428800}
app.security.upload.max-files=${UPLOAD_MAX_FILES:5}
app.security.upload.allowed-content-types=${UPLOAD_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,application/pdf,video/mp4,video/webm,audio/mpeg,audio/mp3,audio/wav,audio/ogg,text/csv,application/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/octet-stream}
app.security.upload.allowed-extensions=${UPLOAD_ALLOWED_EXTENSIONS:.jpg,.jpeg,.png,.webp,.pdf,.mp4,.webm,.mp3,.wav,.ogg,.csv,.xlsx}
app.security.upload.verify-signatures=${UPLOAD_VERIFY_SIGNATURES:true}
app.security.client-address.forwarded-headers-enabled=${CLIENT_ADDRESS_FORWARDED_HEADERS_ENABLED:true}

app.rate-limit.backend=${RATE_LIMIT_BACKEND:redis}
app.rate-limit.redis-key-prefix=${RATE_LIMIT_REDIS_KEY_PREFIX:koupreng:rate-limit:}
app.rate-limit.fail-closed=${RATE_LIMIT_FAIL_CLOSED:true}

app.payment.provider-mode=${PAYMENT_PROVIDER_MODE:static}
app.payment.aba.static-link=${ABA_PAYWAY_STATIC_LINK:https://link.payway.com.kh/ABAPAYrD450560q}
app.payment.admin-secret=${ADMIN_PAYMENT_SECRET}
app.payment.auto-confirm-telegram-detected=${AUTO_CONFIRM_TELEGRAM_DETECTED:false}
app.payment.order-expiry-minutes=${PAYMENT_ORDER_EXPIRY_MINUTES:15}

app.waf.enabled=${WAF_ENABLED:true}
app.waf.audit-only=${WAF_AUDIT_ONLY:false}
app.waf.max-requests-per-minute=${WAF_MAX_REQUESTS_PER_MINUTE:120}
